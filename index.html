<style>
/* Layout: library list on the left, sticky now-playing panel on the right (wide);
   on phones the list fills the screen, a mini bar sits at the bottom and opens a full-screen player. */
:root{
  --bg:#ffffff; --fg:#000000; --mute:#6b6b6b; --line:#e4e4e4; --soft:#f2f2f2; --line2:#d6d6d6;
  --cb:var(--fg); --cf:var(--bg);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --fg:#ffffff; --mute:#8d8d8d; --line:#1f1f1f; --soft:#111111; --line2:#2e2e2e; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#000000; --fg:#ffffff; --mute:#8d8d8d; --line:#1f1f1f; --soft:#111111; --line2:#2e2e2e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.range:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:8px}
svg{display:block}
.cb{fill:var(--cb)} .cf{fill:var(--cf)}
.sf{stroke:var(--cf);fill:none;stroke-linecap:round} .sb{stroke:var(--cb);fill:none;stroke-linecap:round}

.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--display);font-stretch:125%;letter-spacing:-.03em}
.logo{width:32px;height:32px}
.chips{display:flex;gap:6px}
.chip{height:34px;padding-inline:14px;border-radius:999px;border:1.5px solid var(--line2);font-weight:600;font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip span{font:500 11px var(--mono)}

.hero{padding-block:30px 6px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{margin:10px 0 0;font:800 clamp(44px,13vw,72px)/.92 var(--display);font-stretch:125%;letter-spacing:-.04em;text-wrap:balance}
.meta-line{margin-top:12px;font:400 12px var(--mono);color:var(--mute);letter-spacing:.04em}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{height:46px;padding-inline:22px 24px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;font-weight:700;border:1.5px solid var(--fg)}
.btn svg{width:20px;height:20px}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn:active{transform:scale(.97)}

.back{height:34px;padding-inline:8px 14px;border-radius:999px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:13px}
.back svg{width:18px;height:18px}
.back:hover{border-color:var(--fg)}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 16px;margin-top:18px}
.agroup{margin-top:38px}
.agroup+.agroup{margin-top:44px}
.album{display:block;text-align:left;min-width:0}
.acover{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden}
.acover svg,.acover img{display:block;width:100%;height:100%;object-fit:cover}
.album b{display:block;margin-top:10px;font-weight:750;font-stretch:112%;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album small{display:block;color:var(--mute);font-size:13px}
.album:active .acover{transform:scale(.98)}
.ahead{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;padding-block:8px 0}
.ahead .acover{width:min(100%,232px);flex:none}
.ainfo{flex:1 1 260px;min-width:0}
h1.h1s{font-size:clamp(34px,10vw,56px);line-height:.95}
.disc{padding:20px 0 10px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.tracks.flat{margin-top:28px;border-top:1.5px solid var(--fg)}
.rel{margin-top:34px}
.rel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1.5px solid var(--fg)}
.rel-h h2{margin:0;font:700 19px/1.1 var(--display);font-stretch:115%;letter-spacing:-.015em}
.rel-h span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tracks{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:grid;grid-template-columns:26px 48px minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:10px;text-align:left}
.idx{font:500 12px var(--mono);color:var(--mute);display:grid;place-items:center;height:16px}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:100%;background:var(--fg);transform-origin:bottom;transform:scaleY(.35)}
.row.cur .n{display:none}
.row.cur .eq{display:flex}
body.is-playing .row.cur .eq i{animation:eq .9s ease-in-out infinite}
body.is-playing .row.cur .eq i:nth-child(2){animation-delay:-.3s}
body.is-playing .row.cur .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.thumb{display:block;width:48px;height:48px;border-radius:6px;overflow:hidden;flex:none}
.thumb svg,.cover svg,.thumb img,.cover img{display:block;width:100%;height:100%;object-fit:cover}
.t{min-width:0}
.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t b{font-weight:650}
.t small{color:var(--mute);font-size:13px}
.row.cur .t b{font-weight:800}
.dur{font:400 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.empty{margin-top:48px;padding:40px 16px;border:1.5px dashed var(--line2);border-radius:12px;text-align:center;color:var(--mute)}
.empty svg{width:28px;height:28px;margin:0 auto 12px}

.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn:hover{background:var(--soft)}
.like svg{width:20px;height:20px;fill:none;stroke:currentColor}
.like[aria-pressed="true"] svg{fill:var(--fg)}
.like:not([aria-pressed="true"]){color:var(--mute)}
.ic-pause{display:none}
body.is-playing .ic-pause{display:block}
body.is-playing .ic-play{display:none}

/* now playing */
.np{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 24px calc(env(safe-area-inset-bottom,0px) + 22px);
  transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
.np.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
.np-top{display:flex;align-items:center;justify-content:space-between}
.np-top .icon-btn,.np-spacer{width:44px}
.cover{flex:none;aspect-ratio:1;width:min(100%,44vh);margin:14px auto 22px;border-radius:10px;overflow:hidden}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.meta-t{min-width:0}
.meta h2{margin:0;font:800 clamp(24px,7vw,30px)/1.05 var(--display);font-stretch:118%;letter-spacing:-.025em}
.meta p{margin:6px 0 0;color:var(--mute)}
.alb-link{display:block;margin-top:4px;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.alb-link:hover{color:var(--fg)}
#viz{display:block;width:100%;height:48px;margin-top:18px}
.scrub{margin-top:8px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;--p:0%}
.range::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),var(--line2) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-5.5px;border:0}
.range::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),var(--line2) var(--p))}
.range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:0}
.times{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.toggle{color:var(--mute);position:relative}
.toggle[aria-pressed="true"]{color:var(--fg)}
.toggle[aria-pressed="true"]::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg)}
.rep1{display:none}
.toggle.one .rep1{display:block}
.play-big{width:68px;height:68px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.play-big svg{width:30px;height:30px}
.play-big:hover{background:var(--fg)}
.play-big:active{transform:scale(.95)}
.vol{display:none;align-items:center;gap:10px;margin-top:18px;color:var(--mute)}
.vol svg{width:20px;height:20px;flex:none}

/* mini bar */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:4px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px) 16px}
.mini-bar{position:absolute;left:0;top:-1px;height:2px;width:100%;pointer-events:none}
.mini-bar i{display:block;height:2px;width:0;background:var(--fg)}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.mini .thumb{width:44px;height:44px}

@media (min-width:900px){
  .app{max-width:1200px;padding-inline:40px;display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:64px;padding-block:0 64px}
  .np{position:sticky;top:24px;align-self:start;inset:auto;transform:none;visibility:visible;z-index:1;overflow:visible;padding:0;margin-top:96px;transition:none}
  .np-top .icon-btn.close,.np-spacer{display:none}
  .np-top{justify-content:flex-start}
  .cover{width:100%;margin-top:16px}
  .vol{display:flex}
  .mini{display:none}
}
@media (prefers-reduced-motion:reduce){
  .np,.np.open{transition:none}
  body.is-playing .row.cur .eq i{animation:none}
}
</style>

var HEART='<svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
function rowHTML(t,n){
  return '<li class="row" data-i="'+t.i+'"><button class="row-main" data-act="row" data-i="'+t.i+'" aria-label="Play '+t.t+'">'
   +'<span class="idx"><span class="n">'+n+'</span><span class="eq"><i></i><i></i><i></i></span></span>'
   +'<span class="thumb">'+cover(t.i)+'</span>'
   +'<span class="t"><b>'+t.t+'</b><small>'+credit(t)+'</small></span>'
   +'<span class="dur">'+fmt(t.dur)+'</span></button>'
   +'<button class="icon-btn like" data-act="likeRow" data-i="'+t.i+'" aria-label="Like '+t.t+'" aria-pressed="'+(!!state.liked[t.i])+'">'+HEART+'</button></li>';
}
var ACTIONS='<div class="actions"><button class="btn solid" data-act="playall"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a.5.5 0 0 0 .77.42l10-6.5a.5.5 0 0 0 0-.84l-10-6.5A.5.5 0 0 0 8 5.5z" fill="currentColor"/></svg>Play</button><button class="btn" data-act="shuffleall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2.8 4.4 2.5l2.2 3c1.2 1.7 2.4 2.5 4.4 2.5H21M3 17h3.5c2 0 3.2-.8 4.4-2.5M13.5 8.5C14.7 7.8 15.6 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Shuffle</button></div>';
function totalMin(list){var m=Math.round(list.reduce(function(a,t){return a+t.dur},0)/60),h=Math.floor(m/60);return h?h+'h'+(m%60?' '+(m%60)+' min':''):m+' min'}
function albumTracks(a){return TR.filter(function(t){return t.al===a})}
function curList(){
  var l=state.alb>=0?albumTracks(state.alb):state.filter==='liked'?visible():TR;
  return l.map(function(t){return t.i});
}
function heroHTML(){
  if(state.alb>=0){
    var a=ALB[state.alb],items=albumTracks(state.alb);
    return '<div class="ahead"><div class="acover">'+coverA(state.alb)+'</div><div class="ainfo"><div class="eyebrow">'+a.type+'</div><h1 class="h1s">'+a.n+'</h1><div class="meta-line">'+a.artist+' · '+yr(a)+items.length+' tracks · '+totalMin(items)+'</div>'+ACTIONS+'</div></div>';
  }
  if(state.filter==='liked'){
    var v=visible();
    return '<div class="eyebrow">Your music</div><h1>Liked</h1><div class="meta-line">'+v.length+(v.length===1?' track':' tracks')+'</div>'+(v.length?ACTIONS:'');
  }
  return '<div class="eyebrow">Your music</div><h1>Library</h1><div class="meta-line">'+TR.length+' tracks · '+totalMin(TR)+' · '+ALB.length+' releases</div>'+ACTIONS;
}
function render(){
  var home=state.alb<0,liked=state.filter==='liked',root=$('#rel');
  $('#chips').hidden=!home;$('#back').hidden=home;
  $('#hero').innerHTML=heroHTML();
  if(home&&!liked){
    var groups=[],gm={};
    ALB.forEach(function(a,i){var k=a.by||a.artist;if(!gm[k]){gm[k]={name:k,items:[]};groups.push(gm[k])}gm[k].items.push(i)});
    groups.forEach(function(g){g.items.sort(function(x,y){return (ALB[x].year||9999)-(ALB[y].year||9999)})});
    root.innerHTML=groups.map(function(g){
      return '<section class="agroup"><div class="rel-h"><h2>'+g.name+'</h2><span>'+g.items.length+(g.items.length===1?' release':' releases')+'</span></div><div class="albums">'+g.items.map(function(i){
        var a=ALB[i];
        return '<button class="album" data-act="album" data-a="'+i+'" aria-label="Open '+a.n+'"><span class="acover">'+coverA(i)+'</span><b>'+a.n+'</b><small>'+(a.artist!==g.name?(a.sub||a.artist)+' · ':'')+yr(a)+a.type+'</small></button>';
      }).join('')+'</div></section>';
    }).join('');
  } else if(home){
    var v=visible();
    root.innerHTML=v.length?'<ul class="tracks flat">'+v.map(function(t,k){return rowHTML(t,k+1)}).join('')+'</ul>'
      :'<div class="empty"><svg class="like" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Nothing liked yet. Tap the heart on a track to keep it here.</div>';
  } else {
    root.innerHTML='<ul class="tracks flat">'+albumTracks(state.alb).map(function(t,k){return (t.disc?'<li class="disc">Disc '+t.disc+'</li>':'')+rowHTML(t,k+1)}).join('')+'</ul>';
  }
  mark();
}
function mark(){$$('.row').forEach(function(r){r.classList.toggle('cur',+r.getAttribute('data-i')===state.i)})}
function likedCount(){$('#likedN').textContent=Object.keys(state.liked).length}
function paint(){
  var t=TR[state.i];
  $$('.js-title').forEach(function(e){e.textContent=t.t});
  $$('.js-sub').forEach(function(e){e.textContent=credit(t)});
  $$('.js-alb').forEach(function(e){e.textContent=ALB[t.al].n+(ALB[t.al].year?' · '+ALB[t.al].year:'')});
  $$('.js-cover').forEach(function(e){e.innerHTML=cover(t.i)});
  $('#tdur').textContent=fmt(t.dur);$('#seek').max=t.dur;
  var l=!!state.liked[t.i];$$('.js-like').forEach(function(e){e.setAttribute('aria-pressed',l)});
  mark();tick();idle=true;
}
function setPlaying(v){
  state.playing=v;document.body.classList.toggle('is-playing',v);
  $$('[data-act=play]').forEach(function(b){b.setAttribute('aria-label',v?'Pause':'Play')});
  if(!v)idle=true;
}
function syncToggles(){
  $$('[data-act=shuffle]').forEach(function(b){b.setAttribute('aria-pressed',state.shuffle)});
  $$('[data-act=repeat]').forEach(function(b){
    b.setAttribute('aria-pressed',state.repeat!=='off');
    b.classList.toggle('one',state.repeat==='one');
    b.setAttribute('aria-label','Repeat '+state.repeat);
  });
}

/* ---------- transport ---------- */
function select(i,auto,list){
  if(list)state.q=list;
  state.i=i;state.pendingBar=0;
  if(auto){initAudio();startTrack(i,0);state.started=true;setPlaying(true);ctx.resume()}
  else{
    if(ctx){killBus();if(ctx.state==='running')ctx.suspend()}
    state.started=false;setPlaying(false);
  }
  paint();
}
function toggle(){
  if(state.playing){if(ctx)ctx.suspend();setPlaying(false);return}
  initAudio();
  if(!state.started){startTrack(state.i,state.pendingBar);state.started=true}
  ctx.resume();setPlaying(true);
}
function queue(){return state.q&&state.q.indexOf(state.i)>-1?state.q:TR.map(function(t){return t.i})}
function next(auto){
  var list=queue(),k=list.indexOf(state.i),n;
  if(state.shuffle&&list.length>1){do{n=list[Math.floor(Math.random()*list.length)]}while(n===state.i)}
  else{
    n=k===-1?list[0]:list[(k+1)%list.length];
    if(auto&&state.repeat==='off'&&k===list.length-1){select(n,false);return}
  }
  select(n,true);
}
function prev(){
  if(pos()>3){seekTo(0);return}
  var list=queue(),k=list.indexOf(state.i);
  select(k===-1?list[0]:list[(k-1+list.length)%list.length],true);
}
function seekTo(sec){
  var t=TR[state.i],bar=Math.max(0,Math.min(t.bars-1,Math.round(sec/t.barDur)));
  if(state.started)startTrack(state.i,bar,t.file?Math.max(0,Math.min(t.dur-1,sec)):null);else state.pendingBar=bar;
  tick();
}
function ended(){if(state.repeat==='one')select(state.i,true);else next(true)}
function toggleLike(i){
  if(state.liked[i])delete state.liked[i];else state.liked[i]=true;
  save();likedCount();
  if(state.alb<0&&state.filter==='liked')render();
  else $$('.row .like').forEach(function(b){if(+b.getAttribute('data-i')===i)b.setAttribute('aria-pressed',!!state.liked[i])});
  var l=!!state.liked[state.i];$$('.js-like').forEach(function(e){e.setAttribute('aria-pressed',l)});
}

/* ---------- events ---------- */
var seek=$('#seek'),dragging=false,np=$('#np');
seek.addEventListener('input',function(){
  dragging=true;var t=TR[state.i],p=+seek.value;
  seek.style.setProperty('--p',(p/t.dur*100)+'%');$('#tcur').textContent=fmt(p);
});
seek.addEventListener('change',function(){dragging=false;seekTo(+seek.value)});
var volEl=$('#vol');volEl.value=state.vol;volEl.style.setProperty('--p',(state.vol*100)+'%');
volEl.addEventListener('input',function(){
  state.vol=+volEl.value;volEl.style.setProperty('--p',(state.vol*100)+'%');
  if(master)master.gain.setTargetAtTime(state.vol,ctx.currentTime,.02);save();
});
document.addEventListener('click',function(e){
  var chip=e.target.closest('[data-filter]');
  if(chip){
    state.filter=chip.getAttribute('data-filter');
    $$('[data-filter]').forEach(function(c){c.setAttribute('aria-pressed',c===chip)});
    state.alb=-1;render();window.scrollTo(0,0);return;
  }
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='row'){var i=+b.getAttribute('data-i');if(i===state.i)toggle();else select(i,true,curList())}
  else if(a==='play')toggle();
  else if(a==='next')next(false);
  else if(a==='prev')prev();
  else if(a==='shuffle'){state.shuffle=!state.shuffle;syncToggles()}
  else if(a==='repeat'){state.repeat=state.repeat==='off'?'all':state.repeat==='all'?'one':'off';syncToggles()}
  else if(a==='like')toggleLike(state.i);
  else if(a==='likeRow')toggleLike(+b.getAttribute('data-i'));
  else if(a==='open'){np.classList.add('open');fit()}
  else if(a==='close')np.classList.remove('open');
  else if(a==='playall'){state.shuffle=false;syncToggles();var l0=curList();select(l0[0],true,l0)}
  else if(a==='shuffleall'){state.shuffle=true;syncToggles();var l1=curList();select(l1[Math.floor(Math.random()*l1.length)],true,l1)}
  else if(a==='album'){state.alb=+b.getAttribute('data-a');render();window.scrollTo(0,0)}
  else if(a==='back'){state.alb=-1;render();window.scrollTo(0,0)}
  else if(a==='gotoAlbum'){state.alb=TR[state.i].al;state.filter='all';$$('[data-filter]').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-filter')==='all')});np.classList.remove('open');render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){np.classList.remove('open');return}
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='button')return;
  if(e.key===' '){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight')next(false);
  else if(e.key==='ArrowLeft')prev();
});

/* ---------- visualizer + clock ---------- */
var cv=$('#viz'),g2=cv.getContext('2d'),fdata=null,idle=true,dpr=1;
function fit(){
  var r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));idle=true;
}
window.addEventListener('resize',fit);
function draw(){
  if(!state.playing&&!idle)return;
  var W=cv.width,H=cv.height,n=44;
  g2.clearRect(0,0,W,H);
  g2.strokeStyle=(getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#000').trim();
  g2.lineWidth=2.4*dpr;g2.lineCap='round';
  if(state.playing&&analyser){if(!fdata)fdata=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(fdata)}
  for(var i=0;i<n;i++){
    var v=0;
    if(state.playing&&fdata){var b=Math.floor(Math.pow(i/n,1.55)*88)+1;v=Math.min(1,fdata[b]/255*1.25)}
    var h=Math.max(3*dpr,v*H),x=(i+.5)*(W/n),y1=(H-h)/2+1.2*dpr,y2=(H+h)/2-1.2*dpr;
    g2.globalAlpha=state.playing?1:.35;
    g2.beginPath();g2.moveTo(x,y1);g2.lineTo(x,y2);g2.stroke();
  }
  g2.globalAlpha=1;
  if(!state.playing)idle=false;
}
function tick(){
  var t=TR[state.i],p=pos();
  if(!dragging){
    seek.value=p;seek.style.setProperty('--p',(p/t.dur*100)+'%');$('#tcur').textContent=fmt(p);
  }
  $('#mprog').style.width=(p/t.dur*100)+'%';
  if(T.on&&ctx&&ctx.currentTime>=T.start+t.dur){T.on=false;ended()}
}
function loop(){tick();draw();requestAnimationFrame(loop)}

/* ---------- boot ---------- */
render();likedCount();syncToggles();paint();fit();loop();
})();
</script>
</body></html>
